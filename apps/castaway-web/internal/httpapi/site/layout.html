{{define "header"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#1f3a24">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>{{if .Game}}{{.Game.Name}} · {{end}}Castaway</title>
<link rel="stylesheet" href="/assets/site.css?v=15"><script src="/assets/theme.js" defer></script>
{{if .Game}}<script src="/assets/castawordle.js?v=4" type="module"></script>{{end}}
{{if .Admin}}<script src="/assets/game-admin.js?v=4" defer></script>{{end}}
</head><body><a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><a class="brand" href="/"><span aria-hidden="true">🔥</span> Castaway</a>
{{if .Allowed}}<nav aria-label="Main"><a href="/me">Me</a><a href="/">Scores</a><a href="/seasons">Seasons</a><a href="/games">Games</a></nav>{{else if .Viewer}}<nav aria-label="Main"><a href="/">Scores</a><a href="/seasons">Seasons</a></nav>{{end}}
<label class="theme-control">Theme <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
</header><main id="main" class="page">{{end}}
{{define "footer"}}</main><footer class="site-footer"><span>Hi {{.User.Username}}.</span><form method="post" action="/auth/logout"><button class="quiet">Log out</button></form></footer></body></html>{{end}}
