openapi: 3.0.0
info:
  title: Castaway Web API
  version: 0.0.0
tags: []
paths:
  /access-requests:
    get:
      operationId: listAccessRequests
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccessRequestsResponse'
  /access-requests/claim:
    post:
      operationId: claimAccessRequest
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAccessRequestResponse'
  /access-requests/{discordUserID}:
    delete:
      operationId: deleteAccessRequest
      parameters:
        - name: discordUserID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
  /activities/{activityID}:
    get:
      operationId: getActivity
      parameters:
        - name: activityID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/GetActivityResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
  /activities/{activityID}/occurrences:
    get:
      operationId: listOccurrences
      parameters:
        - name: activityID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ListOccurrencesResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createOccurrence
      parameters:
        - name: activityID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOccurrenceResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOccurrenceRequest'
  /activities/{activityID}/wordle-rounds:
    post:
      operationId: createWordleRound
      parameters:
        - name: activityID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/CreateWordleRoundResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWordleRoundResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWordleRoundRequest'
  /admin-alerts/claim:
    post:
      operationId: claimAdminAlert
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      alert:
                        type: object
                        properties:
                          id:
                            type: string
                          body:
                            type: string
                          revision:
                            type: string
                            nullable: true
                        required:
                          - id
                          - body
                        nullable: true
                      admin_discord_user_ids:
                        type: array
                        items:
                          type: string
                    required:
                      - alert
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guild_ids:
                  type: array
                  items:
                    type: string
              required:
                - guild_ids
  /admin-alerts/{alertID}/approve:
    post:
      operationId: approveAdminAction
      parameters:
        - name: alertID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    additionalProperties: {}
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: string
              required:
                - revision
  /admin-alerts/{alertID}/delivered:
    post:
      operationId: confirmAdminAlert
      parameters:
        - name: alertID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      ok:
                        type: boolean
                    required:
                      - ok
                  - $ref: '#/components/schemas/ErrorResponse'
  /admin/session:
    get:
      operationId: adminSession
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
  /announcements/approvals/claim:
    post:
      operationId: claimAnnouncementApproval
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      announcement:
                        nullable: true
                      send_at:
                        type: string
                        format: date-time
                      revision:
                        type: string
                      missed:
                        type: boolean
                      admin_discord_user_ids:
                        type: array
                        items:
                          type: string
                    required:
                      - announcement
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guild_ids:
                  type: array
                  items:
                    type: string
              required:
                - guild_ids
  /announcements/claim:
    post:
      operationId: claimAnnouncement
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAnnouncementResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimAnnouncementRequest'
  /announcements/{announcementID}/approval-delivered:
    post:
      operationId: confirmApprovalDelivery
      parameters:
        - name: announcementID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      ok:
                        type: boolean
                    required:
                      - ok
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: string
              required:
                - revision
  /announcements/{announcementID}/approve:
    post:
      operationId: approveAnnouncement
      parameters:
        - name: announcementID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      scheduled_at:
                        type: string
                        format: date-time
                    required:
                      - scheduled_at
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_discord_user_id:
                  type: string
                revision:
                  type: string
              required:
                - admin_discord_user_id
                - revision
  /announcements/{announcementID}/finish:
    post:
      operationId: finishAnnouncement
      parameters:
        - name: announcementID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishAnnouncementResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishAnnouncementRequest'
  /announcements/{announcementID}/revise:
    post:
      operationId: reviseAnnouncement
      parameters:
        - name: announcementID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      ok:
                        type: boolean
                    required:
                      - ok
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_discord_user_id:
                  type: string
                revision:
                  type: string
                body:
                  type: string
              required:
                - admin_discord_user_id
                - revision
                - body
  /button-games/{gameID}/resolve:
    post:
      operationId: resolveButtonGame
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      awards:
                        type: object
                        additionalProperties:
                          type: integer
                          format: int32
                    required:
                      - awards
                  - $ref: '#/components/schemas/ErrorResponse'
  /castawordle/{gameID}/play:
    get:
      operationId: getCastawordlePlay
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/CastawordlePlay'
                  - $ref: '#/components/schemas/ErrorResponse'
  /castawordle/{gameID}/play/guesses:
    post:
      operationId: guessCastawordle
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/CastawordlePlay'
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guess:
                  type: string
                position:
                  type: integer
                  format: int32
              required:
                - guess
                - position
  /castawordle/{gameID}/private:
    post:
      operationId: createPrivateCastawordle
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  word_length:
                    type: integer
                    format: int32
                required:
                  - id
                  - word_length
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id:
                  type: string
                name:
                  type: string
                answer:
                  type: string
              required:
                - participant_id
                - name
                - answer
  /castawordle/{gameID}/resolve:
    post:
      operationId: resolveCastawordle
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/WordleRoundResolution'
                  - $ref: '#/components/schemas/ErrorResponse'
  /discord/guilds/{guildID}/channels/{channelID}:
    get:
      operationId: getDiscordChannelBinding
      parameters:
        - name: guildID
          in: path
          required: true
          schema:
            type: string
        - name: channelID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordChannelBindingResponse'
    put:
      operationId: setDiscordChannelBinding
      parameters:
        - name: guildID
          in: path
          required: true
          schema:
            type: string
        - name: channelID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordChannelBindingResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDiscordChannelBindingRequest'
    delete:
      operationId: deleteDiscordChannelBinding
      parameters:
        - name: guildID
          in: path
          required: true
          schema:
            type: string
        - name: channelID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unbound:
                    type: boolean
                required:
                  - unbound
  /discord/guilds/{guildID}/channels/{channelID}/champion-pick:
    put:
      operationId: putChampionPick
      parameters:
        - name: guildID
          in: path
          required: true
          schema:
            type: string
        - name: channelID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      contestant:
                        type: string
                    required:
                      - contestant
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discord_user_id:
                  type: string
                contestant:
                  type: string
              required:
                - discord_user_id
                - contestant
  /draft-threads:
    get:
      operationId: listDraftThreads
      description: Threads the bot watches for draft posts.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      threads:
                        type: array
                        items:
                          type: object
                          properties:
                            instance_id:
                              type: string
                            thread_id:
                              type: string
                          required:
                            - instance_id
                            - thread_id
                    required:
                      - threads
                  - $ref: '#/components/schemas/ErrorResponse'
  /draft-threads/{threadID}/messages:
    post:
      operationId: receiveDraftThreadMessage
      description: 'One post (version) from a watched thread: ignored, duplicate, saved, unchanged, or problem (DM the admin).'
      parameters:
        - name: threadID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      status:
                        type: string
                      instance_id:
                        type: string
                      player:
                        type: string
                      participant_id:
                        type: string
                      problems:
                        type: array
                        items:
                          type: string
                      submission:
                        type: object
                        additionalProperties: {}
                    required:
                      - status
                      - instance_id
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                version:
                  type: string
                author_discord_user_id:
                  type: string
                content:
                  type: string
              required:
                - message_id
                - version
                - author_discord_user_id
                - content
  /free-the-block-games/{gameID}/resolve:
    post:
      operationId: resolveFreeTheBlockGame
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      awards:
                        type: object
                        additionalProperties:
                          type: integer
                          format: int32
                    required:
                      - awards
                  - $ref: '#/components/schemas/ErrorResponse'
  /healthz:
    get:
      operationId: healthz
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /instances:
    get:
      operationId: listInstances
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: name
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResponse'
    post:
      operationId: createInstance
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstanceResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
  /instances/import:
    post:
      operationId: importInstance
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstanceResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportInstanceRequest'
  /instances/{instanceID}:
    get:
      operationId: getInstance
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/GetInstanceResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
  /instances/{instanceID}/activities:
    get:
      operationId: listActivities
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ListActivitiesResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createActivity
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateActivityResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
  /instances/{instanceID}/admin-alerts/{alertKey}:
    put:
      operationId: raiseAdminAlert
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
        - name: alertKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      created:
                        type: boolean
                    required:
                      - created
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                action:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - episode_import
                    payload:
                      type: object
                      additionalProperties: {}
                  required:
                    - kind
                    - payload
              required:
                - body
  /instances/{instanceID}/admins:
    post:
      operationId: addInstanceAdmin
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddInstanceAdminResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInstanceAdminRequest'
  /instances/{instanceID}/admins/bootstrap:
    post:
      operationId: bootstrapInstanceAdmin
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapAdminResponse'
  /instances/{instanceID}/announcements:
    post:
      operationId: createAnnouncement
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
    get:
      operationId: listAnnouncements
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementListResponse'
  /instances/{instanceID}/announcements/{announcementID}:
    delete:
      operationId: deleteAnnouncement
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
        - name: announcementID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      deleted:
                        type: string
                    required:
                      - deleted
                  - $ref: '#/components/schemas/ErrorResponse'
  /instances/{instanceID}/announcements/{announcementID}/approval:
    put:
      operationId: requestAnnouncementApproval
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
        - name: announcementID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - {}
                  - $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                send_at:
                  type: string
                  format: date-time
              required:
                - send_at
  /instances/{instanceID}/announcements/{announcementID}/body:
    put:
