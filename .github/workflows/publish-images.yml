name: Publish Images

# Push to feature/** deploys castaway-web to preview. Push to main deploys preview, then production.
# Deploys are digest pins committed to main; Argo CD syncs them.
on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'apps/castaway-web/**'
      - 'apps/castaway-discord-bot/**'
      - 'apps/probst/**'
      - 'seasons/**'
      - '.github/workflows/publish-images.yml'
      - 'script/update-home-k3s-digests.py'
  workflow_dispatch:
    inputs:
      castaway_web:
        description: Build, publish, and deploy castaway-web
        required: false
        type: boolean
        default: false
      castaway_discord_bot:
        description: Build, publish, and deploy castaway-discord-bot (main only)
        required: false
        type: boolean
        default: false
      probst:
        description: Build, publish, and deploy the scheduled probst job (main only)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      castaway_web: ${{ steps.changes.outputs.castaway_web }}
      castaway_discord_bot: ${{ steps.changes.outputs.castaway_discord_bot }}
      probst: ${{ steps.changes.outputs.probst }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            castaway_web:
              - 'apps/castaway-web/**'
            castaway_discord_bot:
              - 'apps/castaway-discord-bot/**'
            probst:
              - 'apps/probst/**'
              - 'seasons/**'
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_CASTAWAY_WEB: ${{ steps.filter.outputs.castaway_web }}
          PUSH_CASTAWAY_DISCORD_BOT: ${{ steps.filter.outputs.castaway_discord_bot }}
          PUSH_PROBST: ${{ steps.filter.outputs.probst }}
          MANUAL_PROBST: ${{ inputs.probst }}
          MANUAL_CASTAWAY_WEB: ${{ inputs.castaway_web }}
          MANUAL_CASTAWAY_DISCORD_BOT: ${{ inputs.castaway_discord_bot }}
        run: |
          castaway_web="${PUSH_CASTAWAY_WEB:-false}"
          castaway_discord_bot="${PUSH_CASTAWAY_DISCORD_BOT:-false}"
          probst="${PUSH_PROBST:-false}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            castaway_web="${MANUAL_CASTAWAY_WEB:-false}"
            castaway_discord_bot="${MANUAL_CASTAWAY_DISCORD_BOT:-false}"
            probst="${MANUAL_PROBST:-false}"
          fi

          # Feature branches deploy only castaway-web to preview.
          if [ "$REF_NAME" != "main" ]; then
            castaway_discord_bot=false
            probst=false
          fi

          echo "castaway_web=$castaway_web" >> "$GITHUB_OUTPUT"
          echo "castaway_discord_bot=$castaway_discord_bot" >> "$GITHUB_OUTPUT"
          echo "probst=$probst" >> "$GITHUB_OUTPUT"

  build-castaway-web:
    needs: changes
    if: needs.changes.outputs.castaway_web == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/castaway-web
          tags: |
            type=raw,value=sha-${{ github.sha }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/castaway-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
          cache-from: type=gha,scope=castaway-web
          cache-to: type=gha,mode=max,scope=castaway-web

  build-castaway-discord-bot:
    needs: changes
    if: needs.changes.outputs.castaway_discord_bot == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/castaway-discord-bot
          tags: |
            type=raw,value=sha-${{ github.sha }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/castaway-discord-bot
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
          cache-from: type=gha,scope=castaway-discord-bot
          cache-to: type=gha,mode=max,scope=castaway-discord-bot

  build-probst:
    needs: changes
    if: needs.changes.outputs.probst == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/probst/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/probst:sha-${{ github.sha }}
          cache-from: type=gha,scope=probst
          cache-to: type=gha,mode=max,scope=probst

  deploy:
    needs:
      - changes
      - build-castaway-web
      - build-castaway-discord-bot
      - build-probst
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.build-castaway-web.result != 'failure' &&
      needs.build-castaway-discord-bot.result != 'failure' &&
      needs.build-probst.result != 'failure' &&
      (needs.changes.outputs.castaway_web == 'true' || needs.changes.outputs.castaway_discord_bot == 'true' || needs.changes.outputs.probst == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: castaway-deploy
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      WEB_DIGEST: ${{ needs.build-castaway-web.outputs.digest }}
      BOT_DIGEST: ${{ needs.build-castaway-discord-bot.outputs.digest }}
      PROBST_DIGEST: ${{ needs.build-probst.outputs.digest }}
    steps:
      # deploy.sh comes from main, not the pushed commit: feature/** pushes (agents included) must not
      # run their own code with the main push key and tailnet access.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          ssh-key: ${{ secrets.MAIN_DEPLOY_KEY }}
      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      # Preview and production hostnames are tailnet-only.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_FEDERATED_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_FEDERATED_AUDIENCE }}
          tags: tag:ci

      - name: Deploy preview
        if: needs.changes.outputs.castaway_web == 'true'
        working-directory: main
        run: scripts/deploy.sh preview

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        working-directory: main
        run: scripts/deploy.sh production
