name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # shortcut: mise's hurl 8.0.1 needs libxml2.so.2, which ubuntu-26.04 dropped; unpin when hurl is upgraded
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci

  integration:
    # shortcut: mise's hurl 8.0.1 needs libxml2.so.2, which ubuntu-26.04 dropped; unpin when hurl is upgraded
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run PostgreSQL integration tests
        run: MISE_EXPERIMENTAL=1 mise run //apps/castaway-web:integration
      - name: Run YAML-managed Hurl scenario
        run: MISE_EXPERIMENTAL=1 mise run //apps/castaway-web:season-scenario

  validate-home-k3s-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Render home-k3s overlays
        run: |
          for overlay in home-k3s home-k3s-preview; do
            kubectl kustomize "deploy/environments/$overlay" > "/tmp/$overlay-render.yaml"
          done
      - name: Check owned private-image contract
        run: |
          for overlay in home-k3s home-k3s-preview; do
            render="/tmp/$overlay-render.yaml"
            ! grep -Eq 'image: (localhost/|.*:latest|.*:sha-placeholder)' "$render"
            grep -q 'imagePullSecrets:' "$render"
            grep -q 'name: ghcr-pull' "$render"
          done
      - name: Check preview stays castaway-web only
        run: |
          render=/tmp/home-k3s-preview-render.yaml
          grep -q '^  name: preview-castaway-web$' "$render"
          ! grep -Eq '^kind: (CronJob|Job|Namespace|ServiceMonitor)$' "$render"
          ! grep -Eq '^  name: (castaway-web|castaway-discord-bot|probst|cloudflared|castaway-web-migrate)$' "$render"
          ! grep -Eq 'ghcr.io/bry-guy/(castaway-discord-bot|probst)|cloudflare/cloudflared' "$render"
