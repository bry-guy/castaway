# Castaway preview: castaway-web only, against the shared production database.
# Writes are real. Migrations come only from main (home-k3s). No bot, cron, tunnel, or ServiceMonitor.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: castaway
namePrefix: preview-
resources:
  - ../../base/castaway-web
  - web-configmap.yaml
patches:
  - path: web-patch.yaml
  - path: web-placement-patch.yaml
  - path: preview-deployment-patch.yaml
  - path: preview-service-patch.yaml
  - path: preview-no-migrate-patch.yaml
images:
  - name: ghcr.io/bry-guy/castaway-web
    newName: ghcr.io/bry-guy/castaway-web
    digest: sha256:5c7d3ed9b4451066b36c073d19cbc699d9579badd2e6c6f16d4cb3fd5a486292
